<!DOCTYPE html>
<head>
	<meta charset="utf-8">
	<style>
		body {
			display: flex;
			justify-content: center;
			height: 100vh;
			align-items: center;
            background-image: url("/static/background.jpg");
			background-size: cover;
		}
        button {
            border: 2px solid whitesmoke;
            background-color: rgba(125,125,125,0.5);
            border-radius: 20%;
            color: white;
            box-shadow: 0px 0px 5px 1px rgba(255,255,255,0.25);
        }

		.hidden {
			display: none;
		}

		.controls {
			height: 70%;
			width: 100%;
			top: 0;
			position: absolute;
		}
		.control {
			width: 25%;
			height: 100%;
		}
		.control > img {
			width: 100%;
			filter: grayscale(100%) contrast(300%) invert();
		}

        .note {
			opacity: 100% !important;
			width: 100%;
			position: absolute;
			animation-name: move;
			animation-timing-function: linear;
			z-index: 999;
			left: 0;
			top: 110%;
		}

		@keyframes move {
			from {
				top: 0%;
			}

			to {
				top: 110%;
			}
		}

		.flash {
			background: linear-gradient(0deg, rgba(255, 180, 0, 1) 0%,
										rgba(0, 0, 0, 0) 100%);
			height: 100%;
			opacity: 0;
			animation-name: flash;
			animation-timing-function: ease-in-out;
			animation-duration: 1s;
		}

		@keyframes flash {
			from {
				opacity: 100%;
			}

			to {
				opacity: 0;
			}
		}

		.popup {
			color: white;
			position: absolute;
			animation-name: popup;
			animation-duration: 1s;
			animation-timing-function: ease-out;
			z-index: 9;
			/* End */
			opacity: 0;
		}

		@keyframes popup {
			from {
				opacity: 1;
				left: 0;
				bottom: 10px;
			}

			to {
				left: -10px;
				bottom: 50px;
				opacity: 0;
				transform: rotate(-15deg);
			}
		}
	</style>
</head>
<body onload="fitText(document.getElementById('infobox'), 1.2); fitText(document.getElementById('buttonReal'), 0.2)">
    <div style="justify-content: center; display: flex; border: 1px solid snow; border-radius: 5%; background-color:rgba(0,0,0,0.5);box-shadow: 0px 0px 20px 5px rgba(255,255,255,0.5); width: 50%; aspect-ratio: 250/170;">
        <div id="game" style="width: 40%;height: 100%; text-align: center; position: relative;">
            <div id="nuotit" style="height: 80%; display: flex;">
				<div style="width: 25%; height: 100%; position: relative;"
					 class="row">
					<div class="flash"></div>
				</div>
				<div style="width: 25%; height: 100%; position: relative;"
					 class="row">
						<!-- <img src="https://yt3.googleusercontent.com/naSWpcgomqi8vovD20lUcbN_a-2R2iBpVtS4ozroGqTYMY9Gwba4LfMBX0EMaY3wI9N6EQzBw4XMjrie=w544-h544-s-l90-rj">
						  -->
						<div class="flash"></div>
				</div>
				<div style="width: 25%; height: 100%; position: relative;"
					 class="row">
					<div class="flash"></div>
				</div>
				<div style="width: 25%; height: 100%; position: relative;"
					 class="row">
					<div class="flash"></div>
				</div>
            </div>
            <div style="height: 20%; width: 100%; position: relative;">
                <div class="controls">
					<button class="control" id="0">
						<img src="https://upload.wikimedia.org/wikipedia/commons/6/63/Star%2A.svg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original">
					</button><button class="control" id="1">
						<img src="https://upload.wikimedia.org/wikipedia/commons/6/63/Star%2A.svg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original">
					</button><button class="control" id="2">
						<img src="https://upload.wikimedia.org/wikipedia/commons/6/63/Star%2A.svg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original">
					</button><button class="control" id="3">
						<img src="https://upload.wikimedia.org/wikipedia/commons/6/63/Star%2A.svg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original">
					</button>
                </div>
            </div>
        </div>
        <div id="infobox" style="width: 60%; height: 170; color: whitesmoke; display: flex;  flex-direction: column;">
            <span>
                Score:
                <span id="score" >
			    </span>
            </span>
            <span>
                Accuracy:
                <span id="accuracy">
                </span>
            </span>
			<span>
                Combo:
                <span id="combo">
                </span>
            </span>
            <span>
                Rank:
                <span id="rank">
                </span>
            </span>
            <span>
                <span id="tulos">
                </span>
            </span>
			<div id="settings" class="hidden"
				 style="margin-top: auto; margin-bottom: 1em ;
						width: 100%; height: fit-content;">
				Settings: <br>
				<label for="volume">Volume</label>
				<input type="range" name="volume" id="volume" value="1" min="0" max="1" step="0.1">
				<br>
				<label for="pitch">Pitch</label>
				<input type="range" name="pitch" id="pitch" value="0" min="-5"
					   max="5" step="1">
				<br>
				<label for="pitch">Speed</label>
				<input type="range" name="speed" id="speed" value="1" min="0.1"
					   max="2" step="0.1">
				<br>
				<button onclick="start()" style="font-size: 2rem;" id="buttonReal">Start</button>
			</div>
			<div id="upload">
				<p>No song file imported yet.</p>
				<input type="file" id="fileInput" accept=".mid,.midi"/>
				<button id="uploadButton">Load file</button>
			</div>
		</div>
    </div>
	<!-- Bruh :D -->
    <script src="/static/fittext.js"></script>
	<script src="/static/main.js" charset="utf-8"></script>
</body>
